# SPDX-License-Identifier: MPL-2.0
name: Linux RPM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-rpm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: RPM (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [tumbleweed, leap16]
    env:
      LOLLY_PROFILE: lolly-start
      LOLLY_EMBED_CATALOG: profile
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C shells/tauri-desktop install --frozen-lockfile
      - name: Build signed frontend and Linux CLI
        env:
          LOLLY_CATALOG_SIGNING_KEY: ${{ secrets.LOLLY_CATALOG_SIGNING_KEY }}
          VITE_CATALOG_PUBLIC_KEY_JWK: ${{ vars.VITE_CATALOG_PUBLIC_KEY_JWK }}
        run: |
          pnpm -C shells/tauri-desktop run build:frontend:release
          pnpm -C shells/tauri-desktop run build:cli-sidecar
      - name: Prepare offline sources
        run: shells/tauri-desktop/rpm/make-sources.sh --skip-frontend
      - name: Build and verify RPM in its distribution container
        run: shells/tauri-desktop/release/build-rpm.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lolly-rpm-${{ matrix.target }}
          path: ~/.cache/lolly-release/artifacts/*.rpm
          if-no-files-found: error
